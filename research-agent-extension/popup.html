<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Research Agent</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 420px;
      min-height: 200px;
      font-family: 'Segoe UI', sans-serif;
      font-size: 13px;
      background: #f9f9f9;
      color: #333;
    }

    .header {
      background: #2e7d32;
      color: white;
      padding: 12px 16px;
      font-size: 15px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-bar {
      background: #e8f5e9;
      border-bottom: 1px solid #c8e6c9;
      padding: 8px 14px;
      font-size: 12px;
      color: #555;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4caf50;
    }

    .status-dot.pdf { background: #1976d2; }
    .status-dot.error { background: #e53935; }
    .status-dot.loading {
      background: #ff9800;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .output {
      padding: 14px;
      line-height: 1.6;
      max-height: 400px;
      overflow-y: auto;
      min-height: 80px;
      background: white;
    }

    /* ── Rendered markdown styles ── */
    .output h2 {
      font-size: 14px;
      color: #2e7d32;
      margin: 14px 0 6px;
      padding-bottom: 4px;
      border-bottom: 1px solid #e0e0e0;
    }
    .output h2:first-child { margin-top: 0; }

    .output h3 {
      font-size: 13px;
      color: #444;
      margin: 10px 0 4px;
    }

    .output p {
      margin: 6px 0;
    }

    .output ul, .output ol {
      margin: 6px 0 6px 20px;
    }

    .output li {
      margin: 4px 0;
    }

    .output a {
      color: #1976d2;
      text-decoration: none;
      word-break: break-all;
    }
    .output a:hover { text-decoration: underline; }

    .output strong {
      color: #222;
    }

    .output .section-card {
      background: #f5f9f5;
      border-left: 3px solid #4caf50;
      border-radius: 4px;
      padding: 10px 12px;
      margin: 10px 0;
    }

    .output .related-works {
      background: #f3f5ff;
      border-left: 3px solid #1976d2;
      border-radius: 4px;
      padding: 10px 12px;
      margin: 10px 0;
    }
    .output .related-works a {
      color: #1565c0;
    }

    .output .plain-text {
      white-space: pre-wrap;
    }

    .footer {
      display: flex;
      gap: 8px;
      padding: 10px 14px;
      border-top: 1px solid #ddd;
      background: #f9f9f9;
    }

    button {
      padding: 7px 14px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
    }

    .btn-copy {
      background: #4caf50;
      color: white;
      flex: 1;
    }

    .btn-retry {
      background: #1976d2;
      color: white;
      flex: 1;
    }

    .btn-copy:hover { background: #388e3c; }
    .btn-retry:hover { background: #1565c0; }

    .placeholder {
      color: #999;
      font-style: italic;
      text-align: center;
      padding: 30px 20px;
    }
  </style>
</head>
<body>
  <div class="header">🔍 AI Research Agent</div>

  <div class="status-bar" id="statusBar">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText">Detecting page type...</span>
  </div>

  <div class="output" id="output">
    <div class="placeholder">Analyzing current page...</div>
  </div>

  <div class="footer">
    <button class="btn-copy" id="copyBtn">📋 Copy</button>
    <button class="btn-retry" id="retryBtn">🔄 Retry</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
